# Read-only equivalent of glyenzy's maintainer-triggered /document operation.
name: document-check
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  document:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
          extra-repositories: 'https://glycoverse.r-universe.dev'
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::roxygen2
          needs: pr-document
      - name: Check generated documentation
        shell: Rscript {0}
        run: roxygen2::roxygenise()
      - run: git diff --exit-code -- NAMESPACE man
