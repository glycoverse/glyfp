# Air formatting, following glyanno's formatter choice with read-only PR checks.
name: format-check
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: posit-dev/setup-air@v1
      - run: air format --check R tests
