# Coverage is retained in GitHub artifacts; no external Codecov setup required.
name: test-coverage
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-coverage:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
          extra-repositories: 'https://glycoverse.r-universe.dev'
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::covr, any::xml2
          needs: coverage
      - name: Test coverage
        shell: Rscript {0}
        run: |
          coverage <- covr::package_coverage()
          print(coverage)
          covr::to_cobertura(coverage, filename = "coverage.xml")
      - uses: actions/upload-artifact@v7
        with:
          name: test-coverage
          path: coverage.xml
      - name: Save coverage failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-failure
          path: |
            *.Rcheck
            **/testthat.Rout*
            **/testthat/testthat-problems.rds
          if-no-files-found: ignore
